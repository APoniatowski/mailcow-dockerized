apiVersion: v2
name: mailcow
description: mailcow-dockerized on Kubernetes (Postfix, Dovecot, Rspamd, SOGo, mailcow UI)
type: application
# Chart version (SemVer). Bump on every chart change.
version: 0.7.1
# mailcow release the files image (data/web, data/conf, data/assets) and image tags belong to.
# Same value update.sh/generate_config.sh write to app_info.inc.php (latest upstream tag).
appVersion: "2026-09"
home: https://mailcow.email
sources:
  - https://github.com/mailcow/mailcow-dockerized
keywords:
  - mail
  - postfix
  - dovecot
  - rspamd
  - sogo
# native sidecars (initContainers with restartPolicy: Always): beta and on by default since 1.29, GA in 1.33
kubeVersion: ">=1.29.0-0"

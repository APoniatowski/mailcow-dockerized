{{- $c := "dockerapi" }}
{{- $v := .Values.dockerapi }}
{{- $name := printf "%s-%s" (include "mailcow.fullname" .) $c }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
---
# DOCKERAPI_BACKEND=kubernetes (P1.5): list/inspect pods by app.kubernetes.io/component, exec via
# pods/exec (websocket exec needs get), restart = delete pod, stats from metrics.k8s.io.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "mailcow.dnsUnbound" . | nindent 6 }}
      {{- include "mailcow.podCommon" (dict "root" .) | nindent 6 }}
      containers:
        - name: dockerapi-mailcow
          image: {{ include "mailcow.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            {{- include "mailcow.secretEnv" (list . "DBROOT" "DBROOT") | nindent 12 }}
            {{- include "mailcow.env.tz" . | nindent 12 }}
            {{- include "mailcow.env.redis" . | nindent 12 }}
            # P1.5 (opt-in env, read once the dockerapi kubernetes backend lands)
            - name: DOCKERAPI_BACKEND
              value: kubernetes
            - name: COMPOSE_PROJECT_NAME
              value: {{ .Values.mailcow.composeProjectName | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
          ports:
            - name: https
              containerPort: 443
          {{- include "mailcow.tcpProbes" (dict "port" 443 "startup" 30) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}

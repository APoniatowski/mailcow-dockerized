{{- if .Values.cronjobs.enabled }}
{{- /*
ofelia job-exec labels from docker-compose.yml -> `kubectl exec` into the component's main container
(the exec'd process gets the container env, like `docker exec`, so the [[ $MASTER == y ]] guards keep
working). Seconds field dropped; "@every 24h" -> daily. `kubectl exec <kind>/<name>` picks one pod of a
replicated workload (sogo, php-fpm): each job runs once.
cronjobs.mode scheduler: one Deployment running busybox crond with these jobs (like the ofelia container);
cronjob: one CronJob per job.
[job name, workload kind/name suffix, component, command, ofelia no-overlap]
*/ -}}
{{- $root := . }}
{{- $fullname := include "mailcow.fullname" . }}
{{- $name := printf "%s-cron" $fullname }}
{{- $mode := .Values.cronjobs.mode }}
{{- if not (has $mode (list "scheduler" "cronjob")) }}
{{- fail (printf "cronjobs.mode must be scheduler or cronjob (got %q)" $mode) }}
{{- end }}
{{- $table := list
  (list "phpfpm-keycloak-sync" "deployment" "php-fpm" "php /crons/keycloak-sync.php || exit 0" true)
  (list "phpfpm-ldap-sync" "deployment" "php-fpm" "php /crons/ldap-sync.php || exit 0" true)
  (list "sogo-sessions" "deployment" "sogo" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool -v expire-sessions ${SOGO_EXPIRE_SESSION} || exit 0" false)
  (list "sogo-ealarms" "deployment" "sogo" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-ealarms-notify -p /etc/sogo/cron.creds || exit 0" false)
  (list "sogo-eautoreply" "deployment" "sogo" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool update-autoreply -p /etc/sogo/sieve.creds || exit 0" false)
  (list "sogo-backup" "deployment" "sogo" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool backup /sogo_backup ALL || exit 0" false)
  (list "dovecot-imapsync-runner" "statefulset" "dovecot" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu nobody /usr/local/bin/imapsync_runner.pl || exit 0" true)
  (list "dovecot-trim-logs" "statefulset" "dovecot" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/trim_logs.sh || exit 0" false)
  (list "dovecot-quarantine" "statefulset" "dovecot" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/quarantine_notify.py || exit 0" false)
  (list "dovecot-clean-q-aged" "statefulset" "dovecot" "[[ ${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/clean_q_aged.sh || exit 0" false)
  (list "dovecot-maildir-gc" "statefulset" "dovecot" "source /source_env.sh ; /usr/local/bin/gosu vmail /usr/local/bin/maildir_gc.sh" false)
  (list "dovecot-sarules" "statefulset" "dovecot" "/usr/local/bin/sa-rules.sh" false)
  (list "dovecot-fts" "statefulset" "dovecot" "/usr/local/bin/gosu vmail /usr/local/bin/optimize-fts.sh" false)
  (list "dovecot-repl-health" "statefulset" "dovecot" "/usr/local/bin/gosu vmail /usr/local/bin/repl_health.sh" false) }}
{{- /* enabled jobs with their effective schedule: dicts {job, kind, comp, cmd, noOverlap, schedule} */}}
{{- $jobs := list }}
{{- range $table }}
{{- $job := index . 0 }}{{ $comp := index . 2 }}
{{- $cfg := index $root.Values.cronjobs.jobs $job | default dict }}
{{- if and (ne (toString $cfg.enabled) "false") (not (and (eq $comp "sogo") $root.Values.skip.sogo)) }}
{{- if not (regexMatch `^(@[a-z]+|\S+( \S+){4})$` (toString $cfg.schedule)) }}
{{- fail (printf "cronjobs.jobs.%s.schedule %q: five cron fields separated by single spaces (or @hourly, @daily, ...)" $job (toString $cfg.schedule)) }}
{{- end }}
{{- $jobs = append $jobs (dict "job" $job "kind" (index . 1) "comp" $comp "cmd" (index . 3) "noOverlap" (index . 4) "schedule" $cfg.schedule) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 4 }}
rules:
  # `kubectl exec deployment/x` resolves the workload's selector, then picks a pod
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
    resourceNames:
      - {{ $fullname }}-php-fpm
      {{- if not .Values.skip.sogo }}
      - {{ $fullname }}-sogo
      {{- end }}
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
    resourceNames:
      - {{ $fullname }}-dovecot
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if eq $mode "cronjob" }}
{{- range $jobs }}
---
{{ include "mailcow.execCronJob" (dict "root" $root "job" .job "schedule" .schedule "target" .comp
  "steps" (list (dict "name" "kubectl" "kind" .kind "comp" .comp "command" (list "/bin/bash" "-c" .cmd)))) }}
{{- end }}
{{- else }}
{{- $s := .Values.cronjobs.scheduler }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 4 }}
data:
  # busybox crond, user mailcow (uid 10900, files image): one line per enabled job, in TZ (mailcow.tz)
  crontab: |
    {{- range $jobs }}
    {{ .schedule }} /bin/sh /etc/mailcow-cron/run-job {{ .job }}
    {{- end }}
  # One job: `kubectl exec` into the target's main container, output prefixed with the job name. ofelia's
  # no-overlap jobs hold a lock for the run (flock -n): a run that finds it taken is skipped.
  run-job: |
    #!/bin/sh
    set -o pipefail
    job=$1
    case "${job}" in
    {{- range $jobs }}
    {{- if contains "'" .cmd }}{{ fail (printf "cron job %s: command must not contain a single quote" .job) }}{{ end }}
      {{ .job }}) target={{ printf "%s/%s-%s" .kind $fullname .comp }}; container={{ .comp }}-mailcow; lock={{ ternary "y" "" .noOverlap }}
        cmd={{ .cmd | squote }} ;;
    {{- end }}
      *) echo "[${job}] unknown job"; exit 1 ;;
    esac
    if [ -n "${lock}" ]; then
      exec 9>"/tmp/${job}.lock"
      if ! flock -n 9; then echo "[${job}] skipped: the previous run is still active (no-overlap)"; exit 0; fi
    fi
    kubectl exec "${target}" -c "${container}" -- /bin/bash -c "${cmd}" 2>&1 \
      | while IFS= read -r line; do printf '[%s] %s\n' "${job}" "${line}"; done
    rc=$?
    [ "${rc}" -eq 0 ] || echo "[${job}] failed (exit ${rc})"
    exit "${rc}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 4 }}
spec:
  # one scheduler, like compose's ofelia container: two would run every job twice
  replicas: 1
  {{- include "mailcow.strategy" "Recreate" | nindent 2 }}
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" "cron") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" "cron") | nindent 8 }}
      annotations:
        checksum/cron: {{ printf "%s %s" .Chart.Version (toJson $jobs) | sha256sum | trunc 16 }}
        {{- with .Values.podDefaults.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      # the jobs run as uid 10900 while crond runs as root: without fsGroup the projected service
      # account token is root-owned 0600 and kubectl in the jobs cannot read it
      securityContext:
        fsGroup: 10900
      {{- include "mailcow.podCommon" (dict "root" .) | nindent 6 }}
      containers:
        # busybox crond must start as root: it switches to the crontab's user (mailcow, uid 10900) with
        # initgroups/setgid/setuid for every job, which needs CAP_SETGID/CAP_SETUID (as uid 10900 every job
        # fails with "can't set groups"), and it only reads root-owned crontabs. Every other capability is
        # dropped; the jobs (kubectl) run as uid 10900 without capabilities.
        - name: cron
          image: {{ include "mailcow.filesImage" . }}
          imagePullPolicy: {{ .Values.files.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /run/cron/crontabs
              cp /etc/mailcow-cron/crontab /run/cron/crontabs/mailcow
              chmod 600 /run/cron/crontabs/mailcow
              echo "cron scheduler, TZ=${TZ}:"; cat /run/cron/crontabs/mailcow
              exec crond -f -c /run/cron/crontabs -L /dev/stdout
          env:
            {{- include "mailcow.env.tz" . | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          volumeMounts:
            - name: config
              mountPath: /etc/mailcow-cron
              readOnly: true
            - name: crontabs
              mountPath: /run/cron
            # HOME of user mailcow (kubectl cache) and the no-overlap locks
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: crontabs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
{{- end }}

{{- $c := "dovecot" }}
{{- $v := .Values.dovecot }}
{{- $m := .Values.mailcow }}
{{- $reload := include "mailcow.tlsReload" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailcow.fullname" . }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
spec:
  # single instance: several dovecots need shared maildir storage with locking or dsync replication
  # (removed in Dovecot 2.4), README "Scaling"
  replicas: 1
  serviceName: dovecot-mailcow
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 8 }}
        {{- include "mailcow.sharedLabel" . | nindent 8 }}
        mailcow.email/mail-ingress: "true"
      annotations:
        {{- include "mailcow.podAnnotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if $reload }}
      # tls-reload signals dovecot's master process
      shareProcessNamespace: true
      {{- end }}
      {{- include "mailcow.dnsUnbound" . | nindent 6 }}
      {{- include "mailcow.podCommon" (dict "root" . "shared" true) | nindent 6 }}
      initContainers:
        {{- $shared := list (dict "dir" "rspamd-custom" "src" "conf/rspamd/custom") }}
        {{- $appends := list (dict "key" "dovecot-k8s.conf" "dst" "conf/dovecot/extra.conf") }}
        {{- include "mailcow.seedInit" (dict "root" . "slices" (list "hooks/dovecot" "conf/dovecot" "assets/templates") "shared" $shared "files" (list (dict "src" "conf/dovecot/global_sieve_before" "dst" "global-sieve/before") (dict "src" "conf/dovecot/global_sieve_after" "dst" "global-sieve/after")) "appends" $appends "ssl" true) | nindent 8 }}
        {{- include "mailcow.rspamdSockSidecar" . | nindent 8 }}
        {{- if $reload }}
        {{- /* supervisord runs /usr/sbin/dovecot -F; HUP = doveadm reload */}}
        {{- include "mailcow.tlsReloadSidecar" (dict "root" . "comm" "dovecot" "cmdline" "/usr/sbin/dovecot*") | nindent 8 }}
        {{- end }}
      containers:
        - name: dovecot-mailcow
          image: {{ include "mailcow.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          # compose: tty: true (entrypoint chowns /dev/console under `set -e`)
          tty: true
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          env:
            {{- include "mailcow.secretEnv" (list . "DOVECOT_MASTER_USER" "DOVECOT_MASTER_USER") | nindent 12 }}
            {{- include "mailcow.secretEnv" (list . "DOVECOT_MASTER_PASS" "DOVECOT_MASTER_PASS") | nindent 12 }}
            - name: MAILCOW_REPLICA_IP
              value: ""
            - name: DOVEADM_REPLICA_PORT
              value: ""
            - name: LOG_LINES
              value: {{ $m.logLines | quote }}
            {{- include "mailcow.env.db" . | nindent 12 }}
            {{- include "mailcow.env.tz" . | nindent 12 }}
            - name: MAILCOW_HOSTNAME
              value: {{ $m.hostname | quote }}
            - name: MAILCOW_PASS_SCHEME
              value: {{ $m.passScheme | quote }}
            - name: IPV4_NETWORK
              value: {{ $m.ipv4Network | quote }}
            - name: ALLOW_ADMIN_EMAIL_LOGIN
              value: {{ $m.allowAdminEmailLogin | quote }}
            - name: MAILDIR_GC_TIME
              value: {{ $m.maildirGcTime | quote }}
            - name: ACL_ANYONE
              value: {{ $m.aclAnyone | quote }}
            - name: SKIP_FTS
              value: {{ include "mailcow.yn" .Values.skip.fts | quote }}
            - name: FTS_HEAP
              value: {{ $m.ftsHeap | quote }}
            - name: FTS_PROCS
              value: {{ $m.ftsProcs | quote }}
            - name: MAILDIR_SUB
              value: {{ $m.maildirSub | quote }}
            - name: MASTER
              value: {{ $m.master | quote }}
            {{- include "mailcow.env.redis" . | nindent 12 }}
            - name: COMPOSE_PROJECT_NAME
              value: {{ $m.composeProjectName | quote }}
            - name: DOCKERAPIHOST
              value: dockerapi
            - name: SOGO_TRUSTED_NETS
              value: {{ include "mailcow.sogoTrustedNets" . | quote }}
            {{- include "mailcow.secretEnv" (list . "SOGO_SSO_PASS" "SOGO_SSO_PASS") | nindent 12 }}
          ports:
            - {name: imap, containerPort: 143}
            - {name: imaps, containerPort: 993}
            - {name: pop3, containerPort: 110}
            - {name: pop3s, containerPort: 995}
            - {name: sieve, containerPort: 4190}
            - {name: lmtp, containerPort: 24}
            - {name: auth-inet, containerPort: 10001}
            - {name: doveadm, containerPort: 12345}
            - {name: imap-pp, containerPort: 10143}
            - {name: imaps-pp, containerPort: 10993}
            - {name: pop3-pp, containerPort: 10110}
            - {name: pop3s-pp, containerPort: 10995}
            - {name: sieve-pp, containerPort: 14190}
          # asks the master process over its socket: no imap-login session, nothing logged
          # (a TCP probe on 143 logs "Disconnected (no auth attempts)" into the UI log every period)
          # master answers + IMAP and LMTP listening, checked without connecting (a TCP probe logs a login per period)
          {{- include "mailcow.probes" (dict "handler" (dict "exec" (dict "command" (list "sh" "-c" "doveadm service status >/dev/null && netstat -ltn | grep -q ':143 ' && netstat -ltn | grep -q ':24 '"))) "startup" 90 "ready" 20 "live" 30 "timeout" 5) | nindent 10 }}
          volumeMounts:
            {{- include "mailcow.hooksMount" "dovecot" | nindent 12 }}
            - name: seed
              subPath: conf/dovecot
              mountPath: /etc/dovecot
            # compose: ./data/conf/dovecot/global_sieve_* inside /etc/dovecot, written by php-fpm
            - name: shared
              subPath: global-sieve/before
              mountPath: /etc/dovecot/global_sieve_before
            - name: shared
              subPath: global-sieve/after
              mountPath: /etc/dovecot/global_sieve_after
            {{- include "mailcow.tlsMounts" . | nindent 12 }}
            # the entrypoint writes SOGo's creds files here on every start (compose: into the sogo and
            # php-fpm bind mounts); pod-local, those pods derive the same files from the Secret.
            # imapsync_runner.pl reads /etc/sogo/sieve.creds locally.
            - name: sogo-creds
              mountPath: /etc/sogo/
            - name: phpfpm-sso
              mountPath: /etc/phpfpm/
            - name: vmail
              mountPath: /var/vmail
            - name: vmail-index
              mountPath: /var/vmail_index
            - name: crypt
              mountPath: /mail_crypt/
            - name: shared
              subPath: rspamd-custom
              mountPath: /etc/rspamd/custom
            - name: seed
              subPath: assets/templates
              mountPath: /templates
              readOnly: true
            # rspamd.sock from the rspamd-sock sidecar (rspamd-pipe-ham/spam)
            - name: rspamd-sock
              mountPath: /var/lib/rspamd
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        {{- include "mailcow.seedVolumes" (dict "root" . "shared" true) | nindent 8 }}
        {{- include "mailcow.tlsVolumes" . | nindent 8 }}
        {{- include "mailcow.rspamdSockVolume" . | nindent 8 }}
        - name: sogo-creds
          emptyDir: {}
        - name: phpfpm-sso
          emptyDir: {}
        - name: vmail
          persistentVolumeClaim:
            claimName: {{ include "mailcow.claimName" (list . "vmail" "vmail") }}
        - name: vmail-index
          persistentVolumeClaim:
            claimName: {{ include "mailcow.claimName" (list . "vmailIndex" "vmail-index") }}
        - name: crypt
          persistentVolumeClaim:
            claimName: {{ include "mailcow.claimName" (list . "crypt" "crypt") }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailcow.fullname" . }}-k8s
  labels:
    {{- include "mailcow.commonLabels" . | nindent 4 }}
data:
  # Appended to data/conf/unbound/unbound.conf (unbound has no include in the repo config).
  # DNSSEC validation stays on for the internet; the cluster zone is unsigned -> domain-insecure.
  # unbound.forwarders set: everything outside the cluster zone goes to them instead of the root servers.
  unbound-k8s.conf: |

    # --- added by the mailcow Helm chart ---
    server:
    {{- range (splitList "," .Values.mailcow.networks) }}
    {{- if trim . }}
      access-control: {{ trim . }} allow
    {{- end }}
    {{- end }}
      domain-insecure: "{{ .Values.clusterDomain }}"
      private-domain: "{{ .Values.clusterDomain }}"
      local-zone: "{{ .Values.clusterDomain }}." transparent
    {{- /* Docker's embedded DNS answers bare service names; resolvers that ignore resolv.conf
           search domains (rspamd's async resolver, postfix's DNS client, dig) rely on that.
           Answer them here with a CNAME to the Service FQDN, which unbound then follows. */}}
    {{- range (list "clamd" "dockerapi" "dovecot" "memcached" "mysql" "nginx" "olefy" "phpfpm" "php-fpm" "postfix" "postfix-tlspol" "redis" "rspamd" "sogo" "unbound" "acme" "watchdog") }}
    {{- range $n := (list . (printf "%s-mailcow" .)) }}
    {{- if ne $n "phpfpm-mailcow" }}
      local-zone: "{{ $n }}." redirect
      local-data: "{{ $n }}. 30 IN CNAME {{ $n }}.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}."
    {{- end }}
    {{- end }}
    {{- end }}
    forward-zone:
      name: "{{ .Values.clusterDomain }}"
      forward-addr: {{ .Values.clusterDNS }}
    {{- with .Values.unbound.forwarders }}
    forward-zone:
      name: "."
      {{- range . }}
      forward-addr: {{ . }}
      {{- end }}
    {{- end }}
  # Appended to data/conf/dovecot/extra.conf (after extraFiles).
  dovecot-k8s.conf: |

    # --- added by the mailcow Helm chart ---
    haproxy_trusted_networks = {{ .Values.mail.proxyTrustedNetworks }}
  # Appended to data/conf/postfix/extra.cf (after extraFiles). The lmtp client's own DNS
  # lookups skip resolv.conf search domains, so the bare "dovecot" transport host
  # (main.cf virtual_transport) only resolves through getaddrinfo.
  # bruteForce: anvil per-client limits for every smtpd service (no master.cf -o overrides them).
  postfix-k8s.cf: |

    # --- added by the mailcow Helm chart ---
    lmtp_host_lookup = native
    {{- with .Values.bruteForce }}
    {{- if .enabled }}
    anvil_rate_time_unit = {{ .rateTimeUnit }}
    smtpd_client_auth_rate_limit = {{ int .authRateLimit }}
    smtpd_client_connection_rate_limit = {{ int .connectionRateLimit }}
    smtpd_client_connection_count_limit = {{ int .connectionCountLimit }}
    smtpd_client_event_limit_exceptions = {{ .limitExceptions }}
    {{- end }}
    {{- end }}
{{- if .Values.extraFiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailcow.fullname" . }}-extra-files
  labels:
    {{- include "mailcow.commonLabels" . | nindent 4 }}
data:
  {{- range $path, $content := .Values.extraFiles }}
  # {{ $path }}
  {{ printf "f-%s" (sha256sum $path | trunc 16) }}: {{ $content | toString | quote }}
  {{- end }}
{{- end }}

{{- $c := "php-fpm" }}
{{- $v := .Values.phpFpm }}
{{- $m := .Values.mailcow }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailcow.fullname" . }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 8 }}
        {{- include "mailcow.sharedLabel" . | nindent 8 }}
      annotations:
        {{- include "mailcow.podAnnotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "mailcow.dnsUnbound" . | nindent 6 }}
      {{- include "mailcow.podCommon" (dict "root" . "shared" true) | nindent 6 }}
      initContainers:
        {{- $slices := list "hooks/phpfpm" "web" "conf/rspamd/dynmaps" "conf/dovecot/auth/mailcowauth.php" "conf/rspamd/meta_exporter" "conf/phpfpm/crons" "conf/phpfpm/php-fpm.d/pools.conf" "conf/phpfpm/php-conf.d" "assets/templates" "conf/nginx" }}
        {{- $shared := list (dict "dir" "rspamd-custom" "src" "conf/rspamd/custom") (dict "dir" "rspamd-vol") (dict "dir" "sogo-conf") (dict "dir" "sogo-sso") }}
        {{- include "mailcow.seedInit" (dict "root" . "slices" $slices "shared" $shared "touch" (list "global-sieve/before" "global-sieve/after")) | nindent 8 }}
      containers:
        - name: php-fpm-mailcow
          image: {{ include "mailcow.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: ["php-fpm", "-d", "date.timezone=$(TZ)", "-d", "expose_php=0"]
          env:
            {{- include "mailcow.env.tz" . | nindent 12 }}
            {{- include "mailcow.env.redis" . | nindent 12 }}
            - name: LOG_LINES
              value: {{ $m.logLines | quote }}
            {{- include "mailcow.env.db" . | nindent 12 }}
            - name: MAILCOW_HOSTNAME
              value: {{ $m.hostname | quote }}
            - name: MAILCOW_PASS_SCHEME
              value: {{ $m.passScheme | quote }}
            - name: IMAP_PORT
              value: {{ $m.imapPort | quote }}
            - name: IMAPS_PORT
              value: {{ $m.imapsPort | quote }}
            - name: POP_PORT
              value: {{ $m.popPort | quote }}
            - name: POPS_PORT
              value: {{ $m.popsPort | quote }}
            - name: SIEVE_PORT
              value: {{ $m.sievePort | quote }}
            - name: IPV4_NETWORK
              value: {{ $m.ipv4Network | quote }}
            - name: IPV6_NETWORK
              value: {{ $m.ipv6Network | quote }}
            - name: SUBMISSION_PORT
              value: {{ $m.submissionPort | quote }}
            - name: SMTPS_PORT
              value: {{ $m.smtpsPort | quote }}
            - name: SMTP_PORT
              value: {{ $m.smtpPort | quote }}
            {{- include "mailcow.secretEnv" (list . "API_KEY" "API_KEY") | nindent 12 }}
            {{- include "mailcow.secretEnv" (list . "API_KEY_READ_ONLY" "API_KEY_READ_ONLY") | nindent 12 }}
            - name: API_ALLOW_FROM
              value: {{ $m.apiAllowFrom | quote }}
            - name: COMPOSE_PROJECT_NAME
              value: {{ $m.composeProjectName | quote }}
            - name: SKIP_FTS
              value: {{ include "mailcow.yn" .Values.skip.fts | quote }}
            - name: SKIP_CLAMD
              value: {{ include "mailcow.yn" .Values.skip.clamd | quote }}
            - name: SKIP_OLEFY
              value: {{ include "mailcow.yn" .Values.skip.olefy | quote }}
            - name: SKIP_SOGO
              value: {{ include "mailcow.yn" .Values.skip.sogo | quote }}
            - name: ALLOW_ADMIN_EMAIL_LOGIN
              value: {{ $m.allowAdminEmailLogin | quote }}
            - name: MASTER
              value: {{ $m.master | quote }}
            - name: DEV_MODE
              value: {{ $m.devMode | quote }}
            - name: DEMO_MODE
              value: {{ $m.demoMode | quote }}
            - name: WEBAUTHN_ONLY_TRUSTED_VENDORS
              value: {{ $m.webauthnOnlyTrustedVendors | quote }}
            - name: CLUSTERMODE
              value: {{ $m.clustermode | quote }}
            - name: ADDITIONAL_SERVER_NAMES
              value: {{ $m.additionalServerNames | quote }}
            # the UI also calls the literal name `dockerapi`
            - name: DOCKERAPIHOST
              value: dockerapi
            - name: MAILCOW_NETWORKS
              value: {{ include "mailcow.networks" . | quote }}
            - name: SOGO_TRUSTED_NETS
              value: {{ include "mailcow.sogoTrustedNets" . | quote }}
          ports:
            - name: fpm-auth
              containerPort: 9001
            - name: fpm
              containerPort: 9002
          {{- include "mailcow.tcpProbes" (dict "port" 9002 "startup" 90) | nindent 10 }}
          volumeMounts:
            {{- include "mailcow.hooksMount" "phpfpm" | nindent 12 }}
            - name: seed
              subPath: web
              mountPath: /web
            - name: seed
              subPath: conf/rspamd/dynmaps
              mountPath: /dynmaps
              readOnly: true
            - name: shared
              subPath: rspamd-custom
              mountPath: /rspamd_custom_maps
            - name: seed
              subPath: conf/dovecot/auth/mailcowauth.php
              mountPath: /mailcowauth/mailcowauth.php
            {{- range list "functions.inc.php" "functions.auth.inc.php" "sessions.inc.php" "functions.mailbox.inc.php" "functions.ratelimit.inc.php" "functions.acl.inc.php" }}
            - name: seed
              subPath: web/inc/{{ . }}
              mountPath: /mailcowauth/{{ . }}
            {{- end }}
            - name: shared
              subPath: rspamd-vol
              mountPath: /var/lib/rspamd
            - name: shared
              subPath: sogo-conf
              mountPath: /etc/sogo/
            - name: seed
              subPath: conf/rspamd/meta_exporter
              mountPath: /meta_exporter
              readOnly: true
            - name: seed
              subPath: conf/phpfpm/crons
              mountPath: /crons
            - name: shared
              subPath: sogo-sso
              mountPath: /etc/sogo-sso/
            - name: seed
              subPath: conf/phpfpm/php-fpm.d/pools.conf
              mountPath: /usr/local/etc/php-fpm.d/z-pools.conf
            - name: seed
              subPath: conf/phpfpm/php-conf.d/opcache-recommended.ini
              mountPath: /usr/local/etc/php/conf.d/opcache-recommended.ini
            - name: seed
              subPath: conf/phpfpm/php-conf.d/upload.ini
              mountPath: /usr/local/etc/php/conf.d/upload.ini
            - name: seed
              subPath: conf/phpfpm/php-conf.d/other.ini
              mountPath: /usr/local/etc/php/conf.d/zzz-other.ini
            - name: shared
              subPath: global-sieve/before
              mountPath: /global_sieve/before
            - name: shared
              subPath: global-sieve/after
              mountPath: /global_sieve/after
            - name: seed
              subPath: assets/templates
              mountPath: /tpls
            - name: seed
              subPath: conf/nginx
              mountPath: /etc/nginx/conf.d/
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        {{- include "mailcow.seedVolumes" (dict "root" . "shared" true) | nindent 8 }}

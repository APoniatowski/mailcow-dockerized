{{- /*
Pre-upgrade hook: make every live Deployment's spec.strategy match the rendered one before Helm applies.
Helm applies server-side and only removes fields it owns. A Deployment created without a strategy
(chart < 0.7.0) carries the API server's defaulted rollingUpdate, owned by nobody; applying
`type: Recreate` next to it is rejected ("may not be specified when strategy type is 'Recreate'").
One kubectl container per Deployment sends mailcow.strategyPatch (strategic merge with $retainKeys:
idempotent, the pod template is untouched, so no rollout). The type is set to the desired value in
both directions, so Helm's apply never has to change a type the patch's field manager co-owns.

Online (helm upgrade, --dry-run=server) the live Deployments are looked up and the Job is only
rendered for those whose type or rollingUpdate differ from mailcow.strategySpec: nothing on an up-to-date release, nothing for Deployments that do not
exist yet (kubectl patch fails on a missing object). Offline (helm template --is-upgrade, client dry
runs) lookup sees nothing: the Job then lists every Recreate Deployment, as a preview. Never on install.
*/}}
{{- if .Release.IsUpgrade }}
{{- $root := . }}
{{- $fullname := include "mailcow.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-strategy-fix" $fullname }}
{{- $online := lookup "v1" "ConfigMap" $ns (printf "%s-k8s" $fullname) }}
{{- $targets := dict }}
{{- range $c, $type := include "mailcow.deploymentStrategies" . | fromJson }}
{{- if $online }}
{{- $live := lookup "apps/v1" "Deployment" $ns (printf "%s-%s" $fullname $c) }}
{{- if $live }}
{{- $s := $live.spec.strategy | default dict }}
{{- $have := dict "type" (toString $s.type) }}
{{- with $s.rollingUpdate }}
{{- $_ := set $have "rollingUpdate" (dict "maxSurge" (toString .maxSurge) "maxUnavailable" (toString .maxUnavailable)) }}
{{- end }}
{{- if ne (toJson $have) (include "mailcow.strategySpec" $type) }}
{{- $_ := set $targets $c $type }}
{{- end }}
{{- end }}
{{- else if eq $type "Recreate" }}
{{- $_ := set $targets $c $type }}
{{- end }}
{{- end }}
{{- if $targets }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "strategy-fix") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "strategy-fix") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames:
      {{- range $c, $_ := $targets }}
      - {{ printf "%s-%s" $fullname $c }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "strategy-fix") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-19"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
{{- with .Values.networkPolicy.egress }}
{{- if .enabled }}
---
{{- /* the live <fullname>-egress-apiserver is the previous release's and may not select this pod yet */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" $root "component" "strategy-fix") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" $root "component" "strategy-fix") | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    {{- include "mailcow.apiServerEgress" . | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "strategy-fix") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-18"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "mailcow.selectorLabels" (dict "root" . "component" "strategy-fix") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      # patches Deployments through the API with its token
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- include "mailcow.podCommon" (dict "root" .) | nindent 6 }}
      containers:
        {{- range $c, $type := $targets }}
        - name: {{ $c }}
          image: {{ include "mailcow.image" $root.Values.cronjobs.image }}
          imagePullPolicy: {{ $root.Values.cronjobs.image.pullPolicy }}
          args:
            - patch
            - deployment
            - {{ printf "%s-%s" $fullname $c }}
            - --type=strategic
            - --field-manager=mailcow-strategy-fix
            - -p
            - {{ include "mailcow.strategyPatch" $type | squote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        {{- end }}
{{- end }}
{{- end }}

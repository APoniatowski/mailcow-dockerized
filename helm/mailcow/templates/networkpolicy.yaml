{{- /*
Ingress NetworkPolicies. Only effective with a CNI that enforces NetworkPolicy.
dockerapi (unauthenticated exec API on :443) is always restricted to the pods that call it, and so is
the rspamd controller relay :11335 (the controller's unix socket, trusted without password).
With networkPolicy on (default): every mailcow port only from pods of this release, except
  - the client-facing mail ports (PROXY listeners with mail.proxyProtocol, plain ports otherwise),
    from networkPolicy.publicMailFrom (empty = anywhere outside mailcow.networks),
  - nginx http/https, from anywhere.
Pods of this release sit in mailcow.networks (MAILCOW_NETWORKS): anything else in the cluster
that could reach postfix/dovecot from the pod CIDR would be trusted as internal.
*/ -}}
{{- $root := . }}
{{- $fullname := include "mailcow.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-dockerapi
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "dockerapi") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" "dockerapi") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "mailcow.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["php-fpm", "watchdog", "acme", "dovecot"]
      ports:
        - port: 443
          protocol: TCP
---
{{- /* rspamd: always rendered. 11335 only from the socket's users; the other ports from release pods
(networkPolicy on) or anywhere (off: this policy selecting rspamd would otherwise block them).
11335 must stay out of every other rule: NetworkPolicies are additive. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-rspamd
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "rspamd") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" "rspamd") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "mailcow.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["php-fpm", "dovecot", "postfix", "watchdog"]
      ports:
        - port: 11335
          protocol: TCP
    - ports:
        - {port: 11333, protocol: TCP}
        - {port: 11334, protocol: TCP}
        - {port: 9900, protocol: TCP}
        - {port: 11445, protocol: TCP}
        - {port: 11445, protocol: UDP}
      {{- if include "mailcow.networkPolicy" . }}
      from:
        {{- include "mailcow.releasePeer" . | nindent 8 }}
      {{- end }}
{{- if include "mailcow.networkPolicy" . }}
{{- /* components reachable from release pods only (all ports) */}}
{{- range list "unbound" "mysql" "redis" "memcached" "clamd" "olefy" "php-fpm" "sogo" "postfix-tlspol" }}
{{- $c := . }}
{{- if not (or (and (eq $c "mysql") $root.Values.externalDatabase.enabled) (and (eq $c "redis") $root.Values.externalRedis.enabled)) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" $root "component" $c) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" $root "component" $c) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "mailcow.releasePeer" $root | nindent 8 }}
{{- end }}
{{- end }}
{{- /* postfix/dovecot: release pods on every port, clients on the exposed ones */}}
{{- $pp := .Values.mail.proxyProtocol }}
{{- $mailPorts := dict
  "postfix" (ternary (list 10025 10465 10587) (list 25 465 587) $pp)
  "dovecot" (ternary (list 10143 10993 14190) (list 143 993 4190) $pp) }}
{{- if .Values.mail.pop3 }}
{{- $_ := set $mailPorts "dovecot" (concat (get $mailPorts "dovecot") (ternary (list 10110 10995) (list 110 995) $pp)) }}
{{- end }}
{{- range $c := list "postfix" "dovecot" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" $root "component" $c) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" $root "component" $c) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "mailcow.releasePeer" $root | nindent 8 }}
    - ports:
        {{- range get $mailPorts $c }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      from:
        {{- include "mailcow.publicMailPeers" $root | nindent 8 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" "nginx") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "mailcow.releasePeer" . | nindent 8 }}
    - ports:
        - port: {{ int .Values.mailcow.httpPort }}
          protocol: TCP
        - port: {{ int .Values.mailcow.httpsPort }}
          protocol: TCP
{{- end }}
{{- with .Values.networkPolicy.egress }}
{{- if .enabled }}
{{- if not .apiServerCIDRs }}
{{- fail "networkPolicy.egress.enabled needs networkPolicy.egress.apiServerCIDRs: the API server endpoint addresses (kubectl get endpoints kubernetes -n default)" }}
{{- end }}
{{- /* Egress (opt-in, independent of networkPolicy.enabled). Every release pod: release pods, kube-dns,
anything outside the cluster CIDRs (internet: SMTP 25, DNS recursion/forwarders, freshclam, rspamd
fuzzy/DNS lists, sa-rules, LDAP/Keycloak, imapsync, SOGo remote calendars, acme), and extraTo.
Rules are additive: extraTo and the API server policy also reach addresses inside clusterCIDRs. */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-egress
  labels:
    {{- include "mailcow.commonLabels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mailcow.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- include "mailcow.releasePeer" $root | nindent 8 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .dns.podLabels | nindent 14 }}
      ports:
        - port: {{ int .dns.port }}
          protocol: UDP
        - port: {{ int .dns.port }}
          protocol: TCP
    - to:
        {{- include "mailcow.allExcept" (include "mailcow.egressClusterCIDRs" $root | fromJsonArray) | nindent 8 }}
    {{- with .extraTo }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
---
{{- /* Kubernetes API server: dockerapi (pods, exec, metrics), CronJob runner (exec), TLS bootstrap and
strategy-fix hook Jobs (strategy-fix also brings its own hook NetworkPolicy: on an upgrade the live policy
is still the previous release's) */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-egress-apiserver
  labels:
    {{- include "mailcow.commonLabels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mailcow.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["dockerapi", "cron", "tls-bootstrap", "strategy-fix"]
  policyTypes: ["Egress"]
  egress:
    {{- include "mailcow.apiServerEgress" . | nindent 4 }}
{{- end }}
{{- end }}

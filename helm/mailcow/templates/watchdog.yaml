{{- if .Values.watchdog.enabled }}
{{- $c := "watchdog" }}
{{- $v := .Values.watchdog }}
{{- $m := .Values.mailcow }}
{{- $acme := .Values.acme.enabled }}
{{- /* postfix.spoolPerPod: no single queue volume to mount; watchdog's mailq check then counts nothing */}}
{{- $spool := not .Values.postfix.spoolPerPod }}
{{- $defaults := dict
  "USE_WATCHDOG" "y" "WATCHDOG_NOTIFY_EMAIL" "" "WATCHDOG_NOTIFY_BAN" "y" "WATCHDOG_NOTIFY_START" "y"
  "WATCHDOG_SUBJECT" "Watchdog ALERT" "WATCHDOG_NOTIFY_WEBHOOK" "" "WATCHDOG_NOTIFY_WEBHOOK_BODY" ""
  "WATCHDOG_EXTERNAL_CHECKS" "n" "WATCHDOG_MYSQL_REPLICATION_CHECKS" "n" "WATCHDOG_VERBOSE" "n"
  "IP_BY_DOCKER_API" "0" "CHECK_UNBOUND" "1"
  "EXTERNAL_CHECKS_THRESHOLD" "1" "NGINX_THRESHOLD" "5" "UNBOUND_THRESHOLD" "5" "REDIS_THRESHOLD" "5"
  "MYSQL_THRESHOLD" "5" "MYSQL_REPLICATION_THRESHOLD" "1" "SOGO_THRESHOLD" "3" "POSTFIX_THRESHOLD" "8"
  "POSTFIX_TLSPOL_THRESHOLD" "8" "CLAMD_THRESHOLD" "15" "DOVECOT_THRESHOLD" "12" "DOVECOT_REPL_THRESHOLD" "20"
  "PHPFPM_THRESHOLD" "5" "RATELIMIT_THRESHOLD" "1" "FAIL2BAN_THRESHOLD" "1" "ACME_THRESHOLD" "1"
  "RSPAMD_THRESHOLD" "5" "OLEFY_THRESHOLD" "5" "MAILQ_THRESHOLD" "20" "MAILQ_CRIT" "30" }}
{{- $env := merge (deepCopy $v.env) $defaults }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailcow.fullname" . }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 8 }}
        {{- if $acme }}
        {{- include "mailcow.sharedLabel" . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "mailcow.podAnnotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "mailcow.dnsUnbound" . | nindent 6 }}
      {{- if $spool }}
      {{- include "mailcow.podCommon" (dict "root" .) | nindent 6 }}
      # mounts postfix's RWO queue volume: must run on postfix's node (with acme and an RWO shared
      # PVC, postfix sits on the shared node too)
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "mailcow.selectorLabels" (dict "root" . "component" "postfix") | nindent 18 }}
      {{- else }}
      {{- include "mailcow.podCommon" (dict "root" . "shared" $acme) | nindent 6 }}
      {{- end }}
      initContainers:
        {{- include "mailcow.seedInit" (dict "root" . "ssl" true) | nindent 8 }}
        {{- include "mailcow.rspamdSockSidecar" . | nindent 8 }}
      containers:
        - name: watchdog-mailcow
          image: {{ include "mailcow.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            - name: IPV6_NETWORK
              value: {{ $m.ipv6Network | quote }}
            - name: LOG_LINES
              value: {{ $m.logLines | quote }}
            {{- include "mailcow.env.tz" . | nindent 12 }}
            {{- include "mailcow.env.db" . | nindent 12 }}
            {{- include "mailcow.secretEnv" (list . "DBROOT" "DBROOT") | nindent 12 }}
            - name: MAILCOW_HOSTNAME
              value: {{ $m.hostname | quote }}
            - name: COMPOSE_PROJECT_NAME
              value: {{ $m.composeProjectName | quote }}
            - name: IPV4_NETWORK
              value: {{ $m.ipv4Network | quote }}
            - name: SKIP_CLAMD
              value: {{ include "mailcow.yn" .Values.skip.clamd | quote }}
            - name: SKIP_OLEFY
              value: {{ include "mailcow.yn" .Values.skip.olefy | quote }}
            - name: SKIP_LETS_ENCRYPT
              value: {{ include "mailcow.yn" (not .Values.acme.enabled) | quote }}
            - name: SKIP_SOGO
              value: {{ include "mailcow.yn" .Values.skip.sogo | quote }}
            - name: HTTPS_PORT
              value: {{ $m.httpsPort | quote }}
            {{- include "mailcow.env.redis" . | nindent 12 }}
            - name: DEV_MODE
              value: {{ $m.devMode | quote }}
            - name: DOCKERAPIHOST
              value: dockerapi
            {{- range $k, $val := $env }}
            - name: {{ $k }}
              value: {{ $val | toString | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # rspamd.sock from the rspamd-sock sidecar (rspamd scan check)
            - name: rspamd-sock
              mountPath: /var/lib/rspamd
            {{- if $spool }}
            - name: postfix-spool
              mountPath: /var/spool/postfix
            {{- end }}
            {{- include "mailcow.tlsMounts" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        {{- include "mailcow.seedVolumes" (dict "root" . "shared" $acme) | nindent 8 }}
        {{- include "mailcow.tlsVolumes" . | nindent 8 }}
        {{- include "mailcow.rspamdSockVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            medium: Memory
        {{- if $spool }}
        - name: postfix-spool
          persistentVolumeClaim:
            claimName: {{ include "mailcow.claimName" (list . "postfix" "postfix") }}
        {{- end }}
{{- end }}

{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $old := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $old = .data | default dict }}
{{- end }}
{{- $apiKey := printf "%s-%s-%s-%s-%s" (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) | upper }}
{{- $apiKeyRo := printf "%s-%s-%s-%s-%s" (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) (randAlphaNum 6) | upper }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailcow.commonLabels" . | nindent 4 }}
  annotations:
    # generated once; kept on uninstall so a reinstall still matches the database
    helm.sh/resource-policy: keep
type: Opaque
data:
  DBPASS: {{ get $old "DBPASS" | default (randAlphaNum 28 | b64enc) }}
  DBROOT: {{ get $old "DBROOT" | default (randAlphaNum 28 | b64enc) }}
  REDISPASS: {{ get $old "REDISPASS" | default (randAlphaNum 28 | b64enc) }}
  API_KEY: {{ get $old "API_KEY" | default ($apiKey | b64enc) }}
  API_KEY_READ_ONLY: {{ get $old "API_KEY_READ_ONLY" | default ($apiKeyRo | b64enc) }}
  SOGO_URL_ENCRYPTION_KEY: {{ get $old "SOGO_URL_ENCRYPTION_KEY" | default (randAlphaNum 16 | b64enc) }}
  SOGO_ENCRYPTION_KEY: {{ get $old "SOGO_ENCRYPTION_KEY" | default (randAlphaNum 16 | b64enc) }}
  SOGO_SSO_PASS: {{ get $old "SOGO_SSO_PASS" | default (randAlphaNum 32 | lower | b64enc) }}
  DOVECOT_MASTER_USER: {{ get $old "DOVECOT_MASTER_USER" | default (default (randAlphaNum 16 | lower) .Values.mailcow.dovecotMasterUser | b64enc) }}
  DOVECOT_MASTER_PASS: {{ get $old "DOVECOT_MASTER_PASS" | default (randAlphaNum 24 | lower | b64enc) }}
{{- end }}

{{- $c := "rspamd" }}
{{- $v := .Values.rspamd }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailcow.fullname" . }}-{{ $c }}
  labels:
    {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mailcow.selectorLabels" (dict "root" . "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mailcow.labels" (dict "root" . "component" $c) | nindent 8 }}
        {{- include "mailcow.sharedLabel" . | nindent 8 }}
      annotations:
        {{- include "mailcow.podAnnotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # worker-proxy binds "rspamd:9900": the hostname maps to the pod IP in /etc/hosts
      hostname: rspamd
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- include "mailcow.dnsUnbound" . | nindent 6 }}
      {{- include "mailcow.podCommon" (dict "root" . "shared" true) | nindent 6 }}
      initContainers:
        {{- $slices := list "hooks/rspamd" "conf/rspamd/override.d" "conf/rspamd/local.d" "conf/rspamd/plugins.d" "conf/rspamd/lua" "conf/rspamd/rspamd.conf.local" "conf/rspamd/rspamd.conf.override" }}
        {{- $shared := list (dict "dir" "rspamd-custom" "src" "conf/rspamd/custom") }}
        {{- /* rspamd PVC: data/ = /var/lib/rspamd, override/ = UI password. Chart < 0.5.0 kept both on the
        shared PVC (rspamd-vol, rspamd-override): copied over once, the socket left behind. */}}
        {{- $script := `mkdir -p /rspamd/data /rspamd/override
if [ ! -e /rspamd/.migrated-from-shared ]; then
  if [ -d /shared/rspamd-vol ]; then
    find /shared/rspamd-vol -mindepth 1 -maxdepth 1 ! -type s -exec cp -a {} /rspamd/data/ \;
  fi
  if [ -s /shared/rspamd-override/worker-controller-password.inc ] && [ ! -s /rspamd/override/worker-controller-password.inc ]; then
    cp /shared/rspamd-override/worker-controller-password.inc /rspamd/override/worker-controller-password.inc
  fi
  touch /rspamd/.migrated-from-shared
fi
touch /rspamd/override/worker-controller-password.inc` }}
        {{- include "mailcow.seedInit" (dict "root" . "slices" $slices "shared" $shared "script" $script "extraMounts" (list (dict "name" "rspamd" "mountPath" "/rspamd"))) | nindent 8 }}
        # controller unix socket -> TCP 11335 for the rspamd-sock sidecars of php-fpm, dovecot, postfix
        # (and watchdog). Probe without connecting: every connection reaches the controller, which logs
        # an EOF error for a bare connect. Dual-stack listener (IPv4-mapped) when the pod has IPv6,
        # IPv4 only when IPv6 is disabled (if_inet6 empty) or absent (ipv6.disable=1).
        - name: rspamd-sock-relay
          image: {{ include "mailcow.filesImage" . }}
          imagePullPolicy: {{ .Values.files.image.pullPolicy }}
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              if grep -qs . /proc/net/if_inet6; then
                exec socat TCP6-LISTEN:11335,ipv6only=0,fork,reuseaddr UNIX-CONNECT:/var/lib/rspamd/rspamd.sock
              else
                exec socat TCP4-LISTEN:11335,fork,reuseaddr UNIX-CONNECT:/var/lib/rspamd/rspamd.sock
              fi
          {{- include "mailcow.relaySecurityContext" . | nindent 10 }}
          ports:
            - name: ctrl-relay
              containerPort: 11335
          startupProbe:
            exec:
              command: ["sh", "-c", "netstat -ltn | grep -q ':11335 '"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: rspamd
              subPath: data
              mountPath: /var/lib/rspamd
              readOnly: true
          resources:
            {{- toYaml $v.socketRelay.resources | nindent 12 }}
      containers:
        - name: rspamd-mailcow
          image: {{ include "mailcow.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            {{- include "mailcow.env.tz" . | nindent 12 }}
            - name: IPV4_NETWORK
              value: {{ .Values.mailcow.ipv4Network | quote }}
            - name: IPV6_NETWORK
              value: {{ .Values.mailcow.ipv6Network | quote }}
            {{- include "mailcow.env.redis" . | nindent 12 }}
            - name: SPAMHAUS_DQS_KEY
              value: {{ .Values.mailcow.spamhausDqsKey | quote }}
            - name: MAILCOW_NETWORKS
              value: {{ include "mailcow.networks" . | quote }}
            # unset, the entrypoint resolves `dovecot`/`rspamd` with dig in a loop (no search domains)
            - name: DOVECOT_TRUSTED_NETS
              value: {{ include "mailcow.dovecotTrustedNets" . | quote }}
            - name: RSPAMD_TRUSTED_NETS
              value: {{ include "mailcow.rspamdTrustedNets" . | quote }}
            # BCC delivery: rspamd's resolver ignores search domains, so the FQDN
            - name: POSTFIXHOST
              value: {{ include "mailcow.svcFqdn" (list . "postfix") | quote }}
          ports:
            - name: normal
              containerPort: 11333
            - name: controller
              containerPort: 11334
            - name: proxy
              containerPort: 9900
            - name: fuzzy
              containerPort: 11445
          # controller /ping answers "pong" without auth (a bare TCP connect logs an EOF error per probe)
          {{- include "mailcow.probes" (dict "handler" (dict "httpGet" (dict "path" "/ping" "port" 11334)) "startup" 90 "timeout" 5) | nindent 10 }}
          volumeMounts:
            {{- include "mailcow.hooksMount" "rspamd" | nindent 12 }}
            - name: shared
              subPath: rspamd-custom
              mountPath: /etc/rspamd/custom
            - name: seed
              subPath: conf/rspamd/override.d
              mountPath: /etc/rspamd/override.d
            # rspamd UI password (dockerapi rspamd/worker_password writes it, then restarts = deletes the pod)
            - name: rspamd
              subPath: override/worker-controller-password.inc
              mountPath: /etc/rspamd/override.d/worker-controller-password.inc
            - name: seed
              subPath: conf/rspamd/local.d
              mountPath: /etc/rspamd/local.d
            - name: seed
              subPath: conf/rspamd/plugins.d
              mountPath: /etc/rspamd/plugins.d
            - name: seed
              subPath: conf/rspamd/lua
              mountPath: /etc/rspamd/lua/
              readOnly: true
            - name: seed
              subPath: conf/rspamd/rspamd.conf.local
              mountPath: /etc/rspamd/rspamd.conf.local
            - name: seed
              subPath: conf/rspamd/rspamd.conf.override
              mountPath: /etc/rspamd/rspamd.conf.override
            # rspamd-vol-1 (own RWO PVC); rspamd.sock reaches the other pods through rspamd-sock-relay
            - name: rspamd
              subPath: data
              mountPath: /var/lib/rspamd
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        {{- include "mailcow.seedVolumes" (dict "root" . "shared" true) | nindent 8 }}
        - name: rspamd
          persistentVolumeClaim:
            claimName: {{ include "mailcow.claimName" (list . "rspamd" "rspamd") }}
